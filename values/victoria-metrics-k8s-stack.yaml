# victoria-metrics-k8s-stack
#
# Provides: VM operator, VMSingle (TSDB), VMAgent (scraper), VMAlert,
# Alertmanager, kube-state-metrics, node-exporter and Grafana 13.
#
# fullnameOverride keeps the operator-generated Service names short and
# predictable: VMSingle CR "vm" -> Service "vmsingle-vm".
fullnameOverride: vm

victoria-metrics-operator:
  enabled: true
  # The stack ships CRDs as a subchart; let Helm own them.
  crds:
    plain: true

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
vmsingle:
  enabled: true
  spec:
    retentionPeriod: "3d"
    storage:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi

# ---------------------------------------------------------------------------
# Scraping
# ---------------------------------------------------------------------------
vmagent:
  enabled: true
  spec:
    # Linkerd's dashboards use rate() over short ranges; upstream Linkerd docs
    # require a scrape interval of 10s or better for them to render correctly.
    scrapeInterval: 10s
    selectAllByDefault: true
    extraArgs:
      promscrape.streamParse: "true"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi

# ---------------------------------------------------------------------------
# Alerting - kept minimal. This demo is about investigation, not paging.
# ---------------------------------------------------------------------------
vmalert:
  enabled: true
  spec:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi

alertmanager:
  enabled: true
  spec:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

# ---------------------------------------------------------------------------
# Targets that do not exist on a single-node minikube. Leaving these enabled
# produces permanently-down scrape targets, which is exactly the kind of false
# signal that derails an AI investigation.
# ---------------------------------------------------------------------------
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# ---------------------------------------------------------------------------
# Grafana 13
# ---------------------------------------------------------------------------
grafana:
  enabled: true

  image:
    # The chart already defaults to Grafana 13.1.1; pinning makes the "must be
    # Grafana 13" requirement explicit and verifiable.
    tag: "13.2.0"

  adminUser: admin
  # Overridden from .env by scripts/30-victoria-metrics.sh
  adminPassword: admin

  service:
    type: NodePort
    portName: http

  persistence:
    enabled: false

  # Grafana 13 keeps search indexes for all ~56 provisioned dashboards in
  # memory and loads the two datasource plugins; at 512Mi it was OOMKilled the
  # moment a Linkerd dashboard was opened.
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1536Mi

  # Native VictoriaMetrics + VictoriaLogs datasource plugins. Requires egress
  # to grafana.com on first boot.
  plugins:
    - victoriametrics-metrics-datasource
    - victoriametrics-logs-datasource

  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      # Linkerd and VictoriaLogs dashboards are created as ConfigMaps outside
      # the monitoring namespace's chart ownership, so watch everywhere.
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

  grafana.ini:
    # Dashboards are provisioned read-only from ConfigMaps; anonymous viewing
    # keeps the demo friction low.
    auth.anonymous:
      enabled: true
      org_role: Viewer
    users:
      default_theme: dark
    plugins:
      allow_loading_unsigned_plugins: victoriametrics-metrics-datasource,victoriametrics-logs-datasource

defaultDashboards:
  enabled: true
  # Ship the standard Kubernetes dashboards; HolmesGPT reads these through the
  # grafana/dashboards toolset.
  dashboards:
    victoriametrics-vmsingle:
      enabled: true
    victoriametrics-operator:
      enabled: true
